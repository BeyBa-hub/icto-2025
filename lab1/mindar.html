<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- ЗМІНА 1: Оновлені версії скриптів A-Frame та MindAR з робочого прикладу -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <!-- ЗМІНА 2: Використовуємо компонент `mindar-image` та прибираємо зайві UI атрибути (вони увімкнені за замовчуванням у новій версії) -->
  <a-scene 
    mindar-image="imageTargetSrc: assets/marker.mind;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="saturn-texture" src="assets/saturn.jpg" crossorigin="anonymous">
      <img id="rings-texture" src="assets/saturn_rings.png" crossorigin="anonymous">
    </a-assets>

    <!-- Сутність, прив'язана до маркера (індекс 0 з файлу .mind) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Система Сатурна -->
      <a-entity id="saturn-system" position="0 -0.2 0" rotation="0 0 -27" scale="0.8 0.8 0.8">
        
        <!-- Сатурн -->
        <a-sphere 
          position="0 0 0" 
          radius="0.6" 
          src="#saturn-texture"
          segments-height="52"
          segments-width="64">
          <a-animation
            attribute="rotation"
            to="0 360 0"
            dur="30000"
            easing="linear"
            repeat="indefinite">
          </a-animation>
        </a-sphere>

        <!-- Кільця Сатурна -->
        <a-ring
          src="#rings-texture"
          radius-inner="0.745"
          radius-outer="1.37"
          rotation="-90 0 0"
          side="double">
        </a-ring>
      </a-entity>
    </a-entity>
    
    <!-- ЗМІНА 3: Камера, як у робочому прикладі, розміщена в кінці і з вимкненим керуванням -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  </a-scene>
</body>
</html>
