<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js Scene - Saturn</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style='margin : 0px; overflow: hidden;'>
  <!-- minimal web ar scene -->
  <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
    <!-- Assets Manager -->
    <a-assets>
      <img id="saturn-texture" src="assets/saturn.jpg" crossorigin="anonymous">
      <img id="rings-texture" src="assets/saturn_rings.png" crossorigin="anonymous">
    </a-assets>

    <!-- Маркер -->
    <a-marker type="pattern" url="assets/marker.patt">
      <!-- Сутність, що групує Сатурн та кільця для спільного нахилу -->
      <a-entity id="saturn-system" position="0 0 0" rotation="0 0 -27" scale="0.8 0.8 0.8">
        
        <!-- Сатурн -->
        <a-sphere 
          position="0 0 0" 
          radius="0.6" 
          src="#saturn-texture"
          segments-height="52"
          segments-width="64">
          <!-- Анімація обертання Сатурна навколо власної осі (Y) -->
          <a-animation
            attribute="rotation"
            to="0 360 0"
            dur="30000"
            easing="linear"
            repeat="indefinite">
          </a-animation>
        </a-sphere>

        <!-- Кільця Сатурна -->
        <a-ring
          src="#rings-texture"
          radius-inner="0.745"
          radius-outer="1.37"
          rotation="-90 0 0"
          side="double">
        </a-ring>

      </a-entity>
    </a-marker>

    <!-- Камера AR.js -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
