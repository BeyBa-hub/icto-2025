<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Scene - Saturn</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Assets Manager -->
    <a-assets>
      <img id="saturn-texture" src="assets/saturn.jpg" crossorigin="anonymous">
      <img id="rings-texture" src="assets/saturn_rings.png" crossorigin="anonymous">
    </a-assets>

    <!-- Навколишнє середовище -->
    <a-sky color="#101010"></a-sky>

    <!-- Камера -->
    <a-camera position="0 1.5 4"></a-camera>

    <!-- Освітлення -->
    <a-light type="point" intensity="1.5" position="5 3 2"></a-light>
    <a-light type="ambient" intensity="0.3"></a-light>

    <!-- Сутність, що групує Сатурн та кільця для спільного нахилу -->
    <a-entity id="saturn-system" position="0 1 -2" rotation="0 0 -27">
      
      <!-- Сатурн -->
      <a-sphere 
        position="0 0 0" 
        radius="0.6" 
        src="#saturn-texture"
        segments-height="52"
        segments-width="64">
        <!-- Анімація обертання Сатурна навколо власної осі (Y) -->
        <a-animation
          attribute="rotation"
          to="0 360 0"
          dur="30000"
          easing="linear"
          repeat="indefinite">
        </a-animation>
      </a-sphere>

      <!-- Кільця Сатурна -->
      <a-ring
        src="#rings-texture"
        radius-inner="0.745"
        radius-outer="1.37"
        rotation="-90 0 0"
        side="double">
      </a-ring>

    </a-entity>
  </a-scene>
</body>
</html>
