<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handpose - Кути між пальцями</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #main-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 2px solid #333;
            background-color: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #status {
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Визначення кутів між пальцями</h1>
    <div id="main-container">
        <!-- Відео буде приховано, оскільки ми малюємо на канвасі -->
        <video id="video" playsinline style="display: none;"></video>
        <canvas id="canvas"></canvas>
    </div>
    <p id="status">Завантаження...</p>

    <!-- ОНОВЛЕНІ ПІДКЛЮЧЕННЯ БІБЛІОТЕК -->
    <!-- 1. Підключаємо повну версію TensorFlow.js, яка включає всі необхідні компоненти -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <!-- 2. Підключаємо модель handpose -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>

    <!-- 3. Підключення нашого власного скрипта. `defer` гарантує, що він виконається після завантаження HTML -->
    <script defer src="src/main1.js"></script>
</body>
</html>
