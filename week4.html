<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тиждень 4</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded 
         arjs="sourceType: video; 
               sourceUrl: marker_test.mp4;
               debugUIEnabled: false;
               detectionMode: mono_and_matrix;
               matrixCodeType: 3x3;
               cameraParametersUrl: parameters/camera_para.dat;
               maxDetectionRate: 60;
               canvasWidth: 640;
               canvasHeight: 480">
        <a-assets>
          <img id="grass" src="images/grass.jpg" crossorigin="anonymous">
          <a-asset-item id="crate-obj" src="https://raw.githubusercontent.com/aframevr/assets/master/test-models/models/crate/crate.obj"></a-asset-item>
          <a-asset-item id="crate-mtl" src="https://raw.githubusercontent.com/aframevr/assets/master/test-models/models/crate/crate.mtl"></a-asset-item>
          <a-asset-item id="owl" src="models/owl.gltf"></a-asset-item>
        </a-assets>
        <!-- Визначення маркера -->
        <a-marker preset="hiro">
            <a-entity id="container" rotation="0 0 0" scale="0.2 0.2 0.2" position="0 0 -4">
                <!-- Тут будуть ваші 3D-елементи -->
                <a-torus position="-2 1 -5" color="green" radius="1.2" animation="property: components.material.material.color; type: color; from: green; to: red; loop: true; dur: 10000"></a-torus>
                <a-plane src="#grass" width="7" height="7" rotation="-55 0 0" position="-2 -2 -5"></a-plane>
                <a-cylinder color="red" height="2" radius="0.05" position="-2 -1 -5"></a-cylinder>
                <a-cylinder color="blue" height="2" radius="0.05" position="-3 -1 -5"></a-cylinder>
                <a-torus-knot color="orange" radius="1.2" position="-3 1 -5" animation="property: rotation; to: 0 0 360; loop: true; dur: 10000"></a-torus-knot>
                <a-plane src="#grid" width="9" height="2" position="3 1 -9"></a-plane>
                <!-- 3D-об'єкти, прив'язані до маркера -->
                <a-obj-model src="#crate-obj" mtl="#crate-mtl" position="2.5 -0.5 -5"></a-obj-model>
                <a-gltf-model src="#owl" position="2 2 -5" scale="0.2 0.2 0.2"></a-gltf-model>
            </a-entity> 
        
        </a-marker> 
        <!-- Другий маркер - Kanji -->
        <a-marker preset="kanji">
            <a-sphere radius="0.5" color="white" position="0 0.5 0"></a-sphere>
        </a-marker>
        <a-marker type="pattern" url="images/mymarker.patt">
            <a-sphere radius="0.8" color="green" position="0 0.5 0"></a-sphere>
            <a-box position="0 0.5 0" color="green"></a-box>
        </a-marker>
        <!-- Камера з обмеженням позиції -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
